[project]
name = "scraper-cotizaciones"
version = "0.1.0"
description = "Lista de precios (xlsx/csv) → PDF de cotización para cliente de Mecha"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
