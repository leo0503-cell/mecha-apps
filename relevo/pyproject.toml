[project]
name = "relevo"
version = "0.1.0"
description = "Transferencia verificable del conocimiento de una persona clave"
readme = "README.md"
authors = [
    { name = "Leonardo Padilla", email = "leo0503@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
relevo = "relevo.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
relevo = ["*.html", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint.per-file-ignores]
"src/relevo/demo.py" = ["E501"]
