[project]
name = "traba"
version = "0.1.0"
description = "Expedientes de facturas detenidas con evidencia y responsables"
readme = "README.md"
authors = [
    { name = "Leonardo Padilla", email = "leo0503@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.19.0",
]

[project.scripts]
traba = "traba.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
traba = ["*.html", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
